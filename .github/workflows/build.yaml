name: Builder

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Check formatting
        run: |
          files=$(gofmt -l *.go)
          test -z "$files" || (echo "$files" && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The packages are built inside Debian stable rather than with the
      # runner's own toolchain: it pins the build environment to the oldest
      # release the package targets, and keeps the job off the runner's apt.
      - name: Build packages
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              build-essential debhelper dh-exec golang-go
            dpkg-buildpackage --build=any -us -uc
            for arch in arm64 armhf; do
              dpkg-buildpackage --host-arch "$arch" --build=any -d -us -uc
            done
            mkdir -p /src/dist
            cp /tg-sendmail_*.deb /src/dist/
            chown -R '"$(id -u):$(id -g)"' /src/dist
          '
      - name: List artifacts
        run: ls -l dist
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.deb"
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
